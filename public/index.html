      controls: [
        select('Position', POSITIONS, p.position, (v) => { p.position = v; load(); }),
        numberInput('Max price (£m)', p.max, { min: 3.5, max: 16, step: 0.5 }, (v) => { if (v !== '') { p.max = v; load(); } }),
        select('Fixtures over', GW_WINDOWS, p.gws, (v) => { p.gws = +v; load(); }),
        state.teamId ? checkbox('Hide players I own', p.hideOwned, (v) => { p.hideOwned = v; load(); }) : null,
      ],
      fetch: () => api('/api/transfers?' + qs({
        position: p.position, max_price: p.max, n_gws: p.gws,
        exclude_team_id: state.teamId && p.hideOwned ? state.teamId : null,
      })),
      render: (d) => [
        podium(d.candidates, [['Score', (x) => one(x.score)], ['Form', (x) => one(x.form)], ['Price', (x) => money(x.price_m)], ['Owned', (x) => one(x.selected_by_pct) + '%']]),
        playerTable(d.candidates, { score: 'score' }), note('Score: ' + d.note), legend()],
      ask: `Suggest the best ${posName} to buy under £${p.max}m for the next ${p.gws} gameweeks, and explain your top pick.`,
    };
  },

  fixtures() {
    const p = state.p.fixtures;
    return {
      title: 'Fixture difficulty',
      blurb: "Every team's upcoming run, easiest first.",
      controls: [select('Show', GW_WINDOWS, p.gws, (v) => { p.gws = +v; load(); })],
      fetch: () => api('/api/fixtures?' + qs({ n_gws: p.gws })),
      render: (d) => [fixtureGrid(d), legend()],
      ask: `Which teams have the best fixtures over the next ${p.gws} gameweeks, and which of their players should I target?`,
    };
  },

  differentials() {
    const p = state.p.differentials;
    return {
      title: 'Differentials',
      blurb: 'In-form players that few managers own.',
      controls: [
        numberInput('Owned by at most (%)', p.own, { min: 0.5, max: 50, step: 0.5 }, (v) => { if (v !== '') { p.own = v; load(); } }),
        select('Position', [['', 'Any position'], ...POSITIONS], p.position, (v) => { p.position = v; load(); }),
        numberInput('Max price (£m)', p.max, { min: 3.5, max: 16, step: 0.5, placeholder: 'Any' }, (v) => { p.max = v; load(); }),
      ],
      fetch: () => api('/api/differentials?' + qs({ max_ownership: p.own, position: p.position, max_price: p.max })),
      render: (d) => [
        podium(d.players, [['Form', (x) => one(x.form)], ['Owned', (x) => one(x.selected_by_pct) + '%'], ['Price', (x) => money(x.price_m)], ['Points', (x) => String(x.total_points)]]),
        playerTable(d.players), note('Sorted by form. Only available players with at least 90 minutes played.'), legend()],
      ask: `Pick the three best differentials owned by under ${p.own}% of managers and make the case for each.`,
    };
  },

  injuries() {
    const p = state.p.injuries;
    const teams = state.meta ? state.meta.teams : [];
    return {
      title: 'Injuries and suspensions',
      blurb: 'Flagged players with the latest news, most-owned first.',
      controls: [select('Team', [['', 'All teams'], ...teams.map((t) => [t, t])], p.team, (v) => { p.team = v; load(); })],
      fetch: () => api('/api/injuries?' + qs({ team: p.team })),
      render: (d) => [injuryTable(d), d.count > d.players.length ? note(`Showing the ${d.players.length} most-owned of ${d.count} flagged players.`) : null],
      ask: p.team ? `Summarise the injury news for ${p.team} and what it means for FPL.`
        : 'Summarise the most important injury news for FPL managers right now.',
    };
  },

  team() {
    return {
      title: 'My team',
      blurb: 'Your current squad, with form and upcoming fixtures.',
      need: state.teamId ? null : 'Enter your team ID in the top bar to see your squad. It is the number in the URL of your FPL Points page, for example fantasy.premierleague.com/entry/1234567/event/12.',
      fetch: () => api('/api/team/' + state.teamId),
      render: squadView,
      ask: state.teamId ? 'Review my team. Where are the weak spots, and what one transfer would you make?' : null,
    };
  },

  planner() {
    const gw = nextGw();
    return {
      title: gw ? `Squad planner for GW${gw}` : 'Squad planner',
      blurb: state.teamId
        ? 'Your squad on a pitch. Drag players around, try transfers and chips, and see what it does to your budget before the deadline.'
        : 'Build a squad from scratch with £100m. Enter your team ID in the top bar to plan from your real squad instead.',
      fetch: () => Promise.all([
        getPlannerPlayers(),
        state.teamId ? api('/api/planner/team/' + state.teamId).catch((e) => ({ error: e.message })) : null,
      ]).then(([players, team]) => ({ players, team })),
      render: startPlanner,
      get ask() { return pl.plan && pl.root && pl.root.isConnected ? planText() : 'Help me plan my squad for the next gameweek.'; },
    };
  },

  league() {
    const p = state.p.league;
    const id = parseInt(p.id, 10);
    const view = p.view === 'h2h' && !state.teamId ? 'radar' : p.view;
    const BLURBS = {
      standings: 'Standings for a classic league.',
      radar: 'What your rivals own, captain and still have in hand, and where that leaves you.',
      h2h: 'You against one rival: only the players you don’t share can change the gap.',
    };
    const ASKS = {
      standings: `Summarise mini-league ${id}: who is leading, and who had the best gameweek?`,
      radar: state.teamId
        ? `Use the rival radar for my mini-league ${id}. Who are the biggest threats I don't cover, and what one move would help me climb?`
        : `Use the rival radar for mini-league ${id}. What is the template, and where are the differentials?`,
      h2h: p.rival ? `How can I catch ${p.rivalName || 'my rival'} in my mini-league? Compare my team with theirs (rival team ID ${p.rival}) and tell me where I can gain points.` : null,
    };
    return {
      title: 'Mini-league',
      blurb: BLURBS[view],
      controls: [
        field('League ID', h('input', {
          class: 'field', inputMode: 'numeric', value: p.id, placeholder: 'e.g. 314',
          title: "The number in the league's URL: fantasy.premierleague.com/leagues/314/standings/c",
          oninput: debounce((e) => { p.id = e.target.value.replace(/\D/g, ''); p.rival = null; store.set('fpl.leagueId', p.id); load(); }, 500),
        })),
        segmented('View', [
          ['radar', 'Rival radar'],
          ['h2h', 'Head to head', state.teamId ? '' : 'Enter your team ID in the top bar first'],
          ['standings', 'Standings'],
        ], view, (v) => { p.view = v; store.set('fpl.leagueView', v); showTab('league'); }),
      ],
      need: id ? null : "Enter a league ID to see your rivals. It is the number in the league's URL, for example fantasy.premierleague.com/leagues/314/standings/c.",
      fetch: () => view === 'standings' ? api('/api/league/' + id) : getRadar(id),
      render: view === 'standings' ? leagueView : view === 'h2h' ? h2hView : radarView,
      ask: id ? ASKS[view] : null,
    };
  },
};

/* ---------- explore rendering ---------- */

let loadSeq = 0;

function showTab(name) {
  state.tab = name;
  history.replaceState(null, '', '#' + name);  // makes each tab linkable
  for (const b of $('#tabs').children) b.setAttribute('aria-selected', String(b.dataset.tab === name));
  const v = views[name]();
  $('#panel').replaceChildren(
    h('div', { class: 'panel-head' },
      h('div', null, h('h2', null, v.title), h('p', null, v.blurb)),
      h('button', { class: 'btn', type: 'button', id: 'askAbout', onclick: () => { const q = views[state.tab]().ask; if (q) askBot(q); } }, 'Ask about this')),
    h('div', { class: 'controls' }, v.controls || []));
  $('#results').replaceChildren();
  load();
}

async function load() {
  const v = views[state.tab]();
  const results = $('#results');
  const seq = ++loadSeq;
  $('#askAbout').hidden = !v.ask;
  if (v.need) { results.classList.remove('stale'); results.replaceChildren(notice(v.need)); return; }
  if (results.childElementCount) results.classList.add('stale');
  else results.replaceChildren(h('div', { class: 'loading' }, 'Loading live FPL data…'));
  let nodes;
  try { nodes = v.render(await v.fetch()); }
  catch (e) {
    nodes = h('div', { class: 'notice error' }, e.message,
      h('div', null, h('button', { class: 'btn small', type: 'button', onclick: load }, 'Try again')));
  }
  if (seq !== loadSeq) return;  // a newer request superseded this one
  results.classList.remove('stale');
  results.replaceChildren(...[nodes].flat().filter(Boolean));
}

function until(date) {
  const mins = Math.floor((date - Date.now()) / 60000);
  if (mins <= 0) return 'deadline passed';
  const d = Math.floor(mins / 1440), hrs = Math.floor((mins % 1440) / 60);
  return 'in ' + (d ? `${d}d ${hrs}h` : hrs ? `${hrs}h ${mins % 60}m` : `${mins}m`);
}

function renderGameweek() {
  const g = state.meta.gameweek;
  const deadline = new Date(g.deadline_utc);
  const when = deadline.toLocaleString(undefined,
    { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  $('#gw').replaceChildren(...[
    h('span', null, h('strong', null, `GW${g.next_gameweek}`), ` deadline ${when}`),
    h('span', { class: 'pill live' }, until(deadline)),
    g.double_gw_teams.length ? h('span', { class: 'pill', title: g.double_gw_teams.join(', ') }, `Double: ${g.double_gw_teams.length} teams`) : null,
    g.blank_gw_teams.length ? h('span', { class: 'pill', title: g.blank_gw_teams.join(', ') }, `Blank: ${g.blank_gw_teams.length} teams`) : null,
  ].filter(Boolean));
}

/* ---------- chat ---------- */

const messages = $('#messages');
const chatInput = $('#chatInput');
let busy = false;

// The server keeps no chat state, so the page holds the conversation and sends it with each question.
const chatHistory = [];
const HISTORY_TURNS = 12;
const locked = () => !!(state.meta && state.meta.chat_locked) && !state.password;

const TOOL_LABELS = {
  get_player: 'player stats', compare_players: 'player comparison', fixture_difficulty: 'fixture difficulty',
  get_my_team: 'your squad', suggest_captain: 'captain ranking', suggest_transfers: 'transfer targets',
  injury_news: 'injury news', find_differentials: 'differentials', gameweek_info: 'gameweek info',
  mini_league: 'mini-league standings', mini_league_rivals: 'rival radar', rival_compare: 'head to head',
};
const STARTERS = [
  'Who should I captain this gameweek?',
  'Which teams have the easiest fixtures over the next 5 gameweeks?',
  'Who are the best midfielders under £7.5m right now?',
  'Are there any double or blank gameweeks coming up?',
];

const escapeHtml = (s) => s.replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Inline Markdown. Input is escaped first, so the result is safe to use as HTML.
function inline(s) {
  return escapeHtml(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

// A small Markdown renderer: paragraphs, headings, lists, tables, rules.
function markdown(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  const out = [];
  let para = [], list = null;
  const flushPara = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
  const flushList = () => {
    if (!list) return;
    const open = list.tag === 'ol' && list.start !== 1 ? `<ol start="${list.start}">` : `<${list.tag}>`;
    out.push(open + list.items.map((i) => '<li>' + inline(i) + '</li>').join('') + `</${list.tag}>`);
    list = null;
  };
  const flush = () => { flushPara(); flushList(); };
  const isRow = (l) => /^\s*\|.*\|\s*$/.test(l || '');
  const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
  const item = (tag, text, start) => {
    flushPara();
    if (!list || list.tag !== tag) { flushList(); list = { tag, items: [], start: start || 1 }; }
    list.items.push(text);
  };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if (!line.trim()) { flush(); continue; }
    if (isRow(line) && /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(lines[i + 1] || '')) {
      flush();
      const head = cells(line), body = [];
      for (i += 2; i < lines.length && isRow(lines[i]); i++) body.push(cells(lines[i]));
      i--;
      out.push('<div class="md-table"><table><thead><tr>'
        + head.map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>'
        + body.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('')
        + '</tbody></table></div>');
      continue;
    }
    if ((m = line.match(/^\s{0,3}#{1,6}\s+(.*?)\s*#*\s*$/))) { flush(); out.push('<h4>' + inline(m[1]) + '</h4>'); continue; }
    if (/^\s*([-*_])\s*(\1\s*){2,}$/.test(line)) { flush(); out.push('<hr>'); continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) { item('ul', m[1]); continue; }
    if ((m = line.match(/^\s*(\d+)[.)]\s+(.*)$/))) { item('ol', m[2], +m[1]); continue; }
    if (list && /^\s{2,}\S/.test(line)) { list.items[list.items.length - 1] += ' ' + line.trim(); continue; }
    flushList();
    para.push(line.trim());
  }
  flush();
  return out.join('');
}

function scrollDown() { messages.scrollTop = messages.scrollHeight; }

function addMessage(kind, text, tools) {
  const welcome = $('.welcome', messages);
  if (welcome) welcome.remove();
  const el = h('div', { class: 'msg ' + kind });
  if (kind === 'bot') {
    el.innerHTML = markdown(text);
    const used = [...new Set((tools || []).map((t) => TOOL_LABELS[t] || t))];
    if (used.length) el.append(h('div', { class: 'used' }, 'Live data checked: ' + used.join(', ')));
  } else {
    el.textContent = text;
  }
  messages.append(el);
  scrollDown();
  return el;
}

function updateLock() {
  const isLocked = locked();
  chatInput.disabled = isLocked;
  chatInput.placeholder = isLocked ? 'Enter the password to chat' : 'Ask about players, captains, transfers…';
  $('#sendBtn').disabled = isLocked || busy;
}

// Shown when the server requires a password for Ask. Checks it without spending a Claude call.
function unlockForm() {
  const input = h('input', { class: 'field', type: 'password', placeholder: 'Password', autocomplete: 'current-password', 'aria-label': 'Chat password' });
  const error = h('p', { class: 'unlock-error', role: 'alert' });
  const form = h('form', {
    class: 'unlock',
    onsubmit: async (e) => {
      e.preventDefault();
      if (!input.value) return;
      try {
        await api('/api/unlock', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: input.value }) });
      } catch (err) { error.textContent = err.message; input.select(); return; }
      state.password = input.value;
      store.set('fpl.chatPassword', state.password);
      if (messages.querySelector('.msg')) { wrap.remove(); updateLock(); } else showWelcome();
      chatInput.focus();
    },
  }, input, h('button', { class: 'btn primary', type: 'submit' }, 'Unlock'));
  const wrap = h('div', { class: 'unlock-wrap' },
    h('p', null, 'This chat is password-protected. Explore works without it.'), form, error);
  return wrap;
}

function showWelcome() {
  const configured = !state.meta || state.meta.chat_configured;
  messages.replaceChildren(h('div', { class: 'welcome' },
    configured ? null : h('p', { class: 'notice' }, 'Chat is not set up yet: it needs an API key. Add GEMINI_API_KEY (free) or ANTHROPIC_API_KEY, then restart the server. Explore works without it.'),
    locked() ? unlockForm() : [
      h('p', { class: 'hello' }, 'Need a second opinion?'),
      h('p', null, 'Ask anything about your FPL team. Answers use live data from the FPL API.'),
      STARTERS.map((q) => h('button', { class: 'btn', type: 'button', onclick: () => send(q) }, q)),
      state.meta && state.meta.provider === 'gemini' ? h('p', { class: 'fineprint' }, "Chat runs on Google's free Gemini service. Google may use questions and answers to improve its products, so don't share anything private.") : null,
    ]));
  updateLock();
}

function setPane(pane) {
  document.body.dataset.pane = pane;
  for (const b of document.querySelectorAll('.switch button')) b.setAttribute('aria-pressed', String(b.dataset.pane === pane));
}

async function send(text) {
  text = (text || '').trim();
  if (!text || busy || locked()) return;
  busy = true;
  updateLock();
  addMessage('user', text);
  const typing = h('div', { class: 'msg bot typing' }, h('i'), h('i'), h('i'), 'Checking live FPL data…');
  messages.append(typing);
  scrollDown();
  try {
    const r = await api('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text, team_id: state.teamId, league_id: parseInt(state.p.league.id, 10) || null,
        history: chatHistory.slice(-HISTORY_TURNS), password: state.password || null,
      }),
    });
    typing.remove();
    addMessage('bot', r.reply, r.tools);
    chatHistory.push({ role: 'user', text }, { role: 'assistant', text: r.reply });
  } catch (e) {
    typing.remove();
    addMessage('error', e.message);
    if (e.status === 401) {  // the saved password is wrong or was changed: ask for it again
      state.password = '';
      store.set('fpl.chatPassword', '');
      messages.append(unlockForm());
      scrollDown();
    }
  } finally {
    busy = false;
    updateLock();
  }
}

// Send a question from the Explore side. If it can't go yet, park it in the input.
function askBot(text) {
  setPane('ask');
  if (locked()) { chatInput.value = text; const pw = $('.unlock input'); if (pw) pw.focus(); return; }
  if (busy) { chatInput.value = text; chatInput.focus(); return; }
  send(text);
}

function autoGrow() {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight + 2, 140) + 'px';
}

/* ---------- wiring ---------- */

$('#tabs').append(...TABS.map(([name, label]) => h('button', {
  class: 'tab', type: 'button', role: 'tab', 'data-tab': name, 'aria-selected': 'false',
  onclick: () => showTab(name),
}, icon(name), label)));

for (const b of document.querySelectorAll('.switch button')) b.addEventListener('click', () => setPane(b.dataset.pane));

const teamInput = $('#teamId');
teamInput.value = state.teamId || '';
teamInput.addEventListener('input', debounce(() => {
  const v = parseInt(teamInput.value.replace(/\D/g, ''), 10);
  state.teamId = v > 0 ? v : null;
  store.set('fpl.teamId', state.teamId ? String(state.teamId) : '');
  showTab(state.tab);
}, 500));

$('#composer').addEventListener('submit', (e) => {
  e.preventDefault();
  if (busy || locked()) return;
  const text = chatInput.value;
  chatInput.value = '';
  autoGrow();
  send(text);
});
chatInput.addEventListener('input', autoGrow);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#composer').requestSubmit(); }
});

$('#newChat').addEventListener('click', () => {
  if (busy) return;
  chatHistory.length = 0;
  showWelcome();
});

async function init() {
  showWelcome();
  try {
    state.meta = await api('/api/meta');
    renderGameweek();
    $('#model').textContent = state.meta.model ? '· ' + state.meta.model : '';
    if (!messages.querySelector('.msg')) showWelcome();
  } catch (e) {
    $('#gw').textContent = e.message;
  }
  showTab(views[location.hash.slice(1)] ? location.hash.slice(1) : state.tab);
}
window.addEventListener('hashchange', () => {
  const name = location.hash.slice(1);
  if (views[name] && name !== state.tab) showTab(name);
});
init();
</script>
