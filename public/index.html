<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPL Assistant</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;

    /* Brand: a night match. Deep purple, pitch green, a cyan and pink spark. */
    --night: #1a0530; --plum: #3a0a5e; --green: #00e88f; --cyan: #29d3ff; --pink: #ff2e7e;
    --gold: #ffc53d; --silver: #a3aec0; --bronze: #e39b62; --kit-edge: rgba(0, 0, 0, .7);

    --page: #f4f0fa; --surface: #ffffff; --surface-2: #f8f5fc;
    --ink: #1c0b2e; --ink-2: #5c4c73;
    --line: #e6def1; --line-strong: #c9bcdc; --wash: rgba(58, 10, 94, .05);
    --primary: #4a0d74; --on-primary: #ffffff; --primary-wash: rgba(106, 31, 176, .12);
    --accent: #00a868; --focus: #6a1fb0;
    --shadow: 0 1px 2px rgba(28, 11, 46, .06), 0 8px 24px rgba(28, 11, 46, .07);
    --warn: #fab219; --crit: #d03b3b;
    /* Fixture difficulty: blue (easy) to red (hard) around a neutral midpoint. */
    --fdr1: #256abf; --fdr1-ink: #fff;    --fdr2: #9ec5f4; --fdr2-ink: #0b0b0b;
    --fdr3: #efedf2; --fdr3-ink: #0b0b0b; --fdr4: #f3b3b1; --fdr4-ink: #0b0b0b;
    --fdr5: #c8393a; --fdr5-ink: #fff;    --fdr-ring: rgba(11, 11, 11, .12);
    /* Positions */
    --gkp: #e0a100; --def: #00a868; --mid: #1f9be0; --fwd: #e8286f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #110521; --surface: #1b0d2e; --surface-2: #24133b;
      --ink: #f5f0fb; --ink-2: #b8abcc;
      --line: #33204c; --line-strong: #4d3769; --wash: rgba(255, 255, 255, .05);
      --primary: #00e88f; --on-primary: #06231a; --primary-wash: rgba(0, 232, 143, .14);
      --accent: #00e88f; --focus: #29d3ff;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
      --fdr1: #3987e5; --fdr1-ink: #0b0b0b; --fdr2: #184f95; --fdr2-ink: #fff;
      --fdr3: #3b3349; --fdr3-ink: #f5f0fb; --fdr4: #8a2f2f; --fdr4-ink: #fff;
      --fdr5: #e66767; --fdr5-ink: #0b0b0b; --fdr-ring: rgba(255, 255, 255, .12);
      --gkp: #ffc53d; --def: #00e88f; --mid: #29d3ff; --fwd: #ff5c9a;
      --silver: #cfd6e2; --kit-edge: rgba(255, 255, 255, .6);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; height: 100dvh;
    font: 14px/1.45 var(--font); background: var(--page); color: var(--ink);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  h2 { margin: 0; }
  svg { display: block; }

  /* top bar: the same night-match band in light and dark mode */
  .topbar {
    position: relative; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 24px;
    padding: 12px 20px 15px; color: #fff;
    background:
      radial-gradient(520px 180px at 88% -50%, rgba(0, 232, 143, .38), transparent 70%),
      radial-gradient(460px 200px at 8% 150%, rgba(255, 46, 126, .30), transparent 70%),
      linear-gradient(100deg, var(--night) 0%, var(--plum) 55%, #2a0a4d 100%);
  }
  .topbar::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: linear-gradient(90deg, var(--green), var(--cyan), var(--pink));
  }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 28px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; }
  .brand svg { width: 30px; height: 30px; }
  .brand em { font-style: normal; color: var(--green); }
  .gw { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; color: rgba(255, 255, 255, .82); }
  .gw strong { font: 700 20px/1 var(--display); letter-spacing: .04em; color: #fff; margin-right: 6px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
    border: 1px solid rgba(255, 255, 255, .28); color: #fff;
  }
  .pill.live { background: var(--green); border-color: transparent; color: #06231a; }
  .pill.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #06231a; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .teamid { margin-left: auto; display: flex; align-items: center; gap: 8px; font-weight: 600; color: rgba(255, 255, 255, .82); }
  .teamid input {
    width: 130px; background: rgba(255, 255, 255, .10); border-color: rgba(255, 255, 255, .28); color: #fff;
  }
  .teamid input::placeholder { color: rgba(255, 255, 255, .55); }

  /* shared controls */
  .field {
    height: 34px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 10px;
    background: var(--surface);
  }
  .btn {
    height: 34px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 10px;
    background: var(--surface); font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: transform .08s, background .15s, border-color .15s;
  }
  .btn:hover:not(:disabled) { background: var(--primary-wash); border-color: var(--primary); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
  .btn.primary:hover:not(:disabled) { background: var(--primary); filter: brightness(1.1); }
  .btn.small { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* layout */
  .switch { display: none; gap: 6px; padding: 10px 16px 0; }
  .switch button { flex: 1; font: 600 17px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
  .switch button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: transparent; }
  .layout {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(340px, 430px);
  }
  .explore { min-width: 0; overflow: auto; padding: 18px 20px 28px; }
  .explore > * { max-width: 1320px; margin-inline: auto; }  /* stays readable on very wide screens */
  .chat {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--surface); border-left: 1px solid var(--line);
  }
  @media (max-width: 900px) {
    .switch { display: flex; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    .chat { border-left: 0; border-top: 1px solid var(--line); margin-top: 10px; }
    body[data-pane="explore"] .chat, body[data-pane="ask"] .explore { display: none; }
    .teamid { margin-left: 0; }
    .explore { padding: 14px 14px 24px; }
  }

  /* explore: tabs and panel heading */
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 4px; margin-bottom: 16px; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px 8px 12px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink-2);
    font: 600 17px/1 var(--display); letter-spacing: .04em; text-transform: uppercase;
    white-space: nowrap; cursor: pointer; transition: background .15s, color .15s, border-color .15s;
  }
  .tab svg { width: 16px; height: 16px; }
  .tab:hover { color: var(--ink); border-color: var(--primary); }
  .tab[aria-selected="true"] { background: var(--primary); color: var(--on-primary); border-color: transparent; box-shadow: 0 6px 16px var(--primary-wash); }
  .ico svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .panel-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .panel-head h2 { font: 700 36px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
  .panel-head h2::after {
    content: ""; display: block; width: 56px; height: 4px; margin-top: 8px; border-radius: 2px;
    background: linear-gradient(90deg, var(--green), var(--cyan));
  }
  .panel-head p { margin: 8px 0 0; color: var(--ink-2); max-width: 60ch; }
  .controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; margin-bottom: 16px; }
  .controls:empty { display: none; }
  .control { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
  .control .field { font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .control input[type="number"] { width: 110px; }
  .check { display: flex; align-items: center; gap: 6px; height: 34px; cursor: pointer; }
  .check input { accent-color: var(--primary); width: 16px; height: 16px; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
  .seg-btn {
    height: 32px; padding: 0 12px; border: 0; background: var(--surface);
    font-size: 14px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink-2); cursor: pointer;
  }
  .seg-btn + .seg-btn { border-left: 1px solid var(--line-strong); }
  .seg-btn[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); font-weight: 600; }
  .seg-btn:disabled { opacity: .5; cursor: not-allowed; }
  .results { transition: opacity .15s; }
  .results.stale { opacity: .45; }

  /* podium: the top three picks */
  .podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  .pod {
    position: relative; overflow: hidden; padding: 14px 16px 16px; border-radius: 18px;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .pod::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--medal); }
  .pod.p1 { --medal: var(--gold); color: #fff; border-color: transparent;
    background:
      radial-gradient(260px 160px at 100% 0%, rgba(0, 232, 143, .30), transparent 70%),
      linear-gradient(135deg, var(--plum), var(--night)); }
  .pod.p2 { --medal: var(--silver); }
  .pod.p3 { --medal: var(--bronze); }
  .pod-rank {
    position: absolute; top: 10px; right: 14px; font: 700 54px/1 var(--display);
    color: var(--medal); opacity: .9;
  }
  .pod-who { display: flex; align-items: center; gap: 12px; padding-right: 44px; }
  .pod-name { font: 700 26px/1.05 var(--display); letter-spacing: .02em; text-transform: uppercase; overflow-wrap: anywhere; }
  .pod-meta { font-size: 12px; color: var(--ink-2); }
  .pod.p1 .pod-meta, .pod.p1 .stat .k { color: rgba(255, 255, 255, .72); }
  .pod-stats { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 12px 0; }
  .stat .k { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
  .stat .v { font: 700 24px/1.1 var(--display); font-variant-numeric: tabular-nums; }
  .stat.main .v { color: var(--accent); }
  .pod.p1 .stat.main .v { color: var(--green); }
  @media (max-width: 760px) { .podium { grid-template-columns: minmax(0, 1fr); } }

  /* club shirt */
  .kit { flex: none; display: inline-block; width: 36px; height: 36px; filter: drop-shadow(0 0 .7px var(--kit-edge)) drop-shadow(0 1px 1px rgba(0, 0, 0, .25)); }
  .kit svg { width: 100%; height: 100%; overflow: visible; }
  .kit text { font: 700 29px/1 var(--display); letter-spacing: .02em; paint-order: stroke; stroke-linejoin: round; }
  .kit.lg { width: 50px; height: 50px; }

  /* tables */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  thead th { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); background: var(--surface-2); }
  tbody tr:last-child > * { border-bottom: 0; }
  tbody tr:not(.group):hover > * { background: var(--wash); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .strong { font-weight: 700; }
  .wrap { white-space: normal; min-width: 240px; }
  .act { width: 1%; text-align: right; }
  .group th { padding: 12px 12px 6px; font: 700 16px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--surface-2); }
  .me > * { background: var(--primary-wash); }
  th.team { font-weight: 600; position: sticky; left: 0; background: var(--surface); }
  .player { display: flex; align-items: center; gap: 10px; }
  .name { font-weight: 600; }
  .sub { font-size: 12px; color: var(--ink-2); }
  .rank {
    flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
    font: 700 14px/1 var(--display); color: var(--ink-2); background: var(--wash);
  }
  .rank.r1 { background: var(--gold); color: #2b1c00; }
  .rank.r2 { background: var(--silver); color: #1d2430; }
  .rank.r3 { background: var(--bronze); color: #2b1400; }
  .pos { padding: 0 6px; border-radius: 5px; font-size: 10px; font-weight: 700; letter-spacing: .05em; color: var(--ink);
    background: color-mix(in srgb, var(--pos) 20%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pos) 60%, transparent); }
  .pos.GKP { --pos: var(--gkp); } .pos.DEF { --pos: var(--def); } .pos.MID { --pos: var(--mid); } .pos.FWD { --pos: var(--fwd); }
  .badge {
    margin-left: 6px; padding: 0 6px; border-radius: 5px; background: var(--pink);
    color: #fff; font-size: 11px; font-weight: 700; vertical-align: 1px;
  }
  .score { display: inline-block; min-width: 54px; }
  .meter { height: 4px; margin-top: 4px; border-radius: 2px; background: var(--wash); }
  .meter i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--green), var(--cyan)); }
  .status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .status.out::before { background: var(--crit); }

  /* fixture difficulty chips */
  .fxs { display: flex; flex-wrap: wrap; gap: 4px; }
  .fx {
    display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px;
    border-radius: 6px; box-shadow: inset 0 0 0 1px var(--fdr-ring);
    font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .fx small { font-size: 10px; font-weight: 700; opacity: .8; }
  .fdr1 { background: var(--fdr1); color: var(--fdr1-ink); }
  .fdr2 { background: var(--fdr2); color: var(--fdr2-ink); }
  .fdr3 { background: var(--fdr3); color: var(--fdr3-ink); }
  .fdr4 { background: var(--fdr4); color: var(--fdr4-ink); }
  .fdr5 { background: var(--fdr5); color: var(--fdr5-ink); }
  .blank { font-size: 12px; color: var(--ink-2); }
  .legend { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 12px; font-size: 12px; color: var(--ink-2); }
  .legend .fx { padding: 0 7px; }
  .note { margin-top: 10px; margin-bottom: 0; font-size: 12px; color: var(--ink-2); max-width: 80ch; }
  .loading { display: flex; align-items: center; gap: 10px; padding: 26px 4px; color: var(--ink-2); font-weight: 500; }
  .loading::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .disclaimer { margin-top: 28px; font-size: 11px; color: var(--ink-2); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .tile { position: relative; overflow: hidden; padding: 14px 14px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; min-width: 0; box-shadow: var(--shadow); }
  .tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--green), var(--cyan), var(--pink)); }
  .tile .k { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
  .tile .v { font: 700 30px/1.15 var(--display); overflow-wrap: anywhere; }
  .tile .s { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
  .tile .v .chips { padding: 6px 0 2px; }
  .tile .v .blank { font-size: inherit; }
  .tile .s .chips { display: inline-flex; vertical-align: middle; }

  /* mini-league: rival radar and head to head */
  .section { margin-top: 24px; }
  .section-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 10px; }
  .section-head h3 { margin: 0; font: 700 20px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
  .section-head p { margin: 0; font-size: 13px; color: var(--ink-2); max-width: 70ch; }
  .results > .controls { margin-bottom: 14px; }
  .results > .controls .control { min-width: 0; max-width: 100%; }
  .results > .controls .field { max-width: 100%; text-overflow: ellipsis; }
  .split { display: grid; gap: 12px; padding: 16px; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-main { flex: 1; min-width: 0; }
  .bar-label { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .bar-label .badge { margin-left: 0; }
  .bar-val { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 4px; background: var(--wash); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--green), var(--cyan)); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip-pill {
    display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: .04em;
    background: var(--primary-wash); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong);
  }
  .role { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--wash); }
  .role.captain { background: var(--primary); color: var(--on-primary); }
  .role.none { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-2); }

  /* squad planner */
  .planner-wrap { container-type: inline-size; }
  .planner { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  @container (min-width: 860px) { .planner { grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr); } .pside { position: sticky; top: 0; } }
  .planner-bar { margin-bottom: 14px; }
  .planner-bar .seg { flex-wrap: wrap; }
  .flash { margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 14%, var(--surface)); font-weight: 600; }
  .pitch {
    position: relative; overflow: hidden; padding: 16px 6px 10px; border-radius: 18px;
    background: repeating-linear-gradient(180deg, #1d8a4b 0 46px, #197c43 46px 92px); box-shadow: var(--shadow);
  }
  .pitch::before { content: ""; position: absolute; inset: 8px; border: 2px solid rgba(255, 255, 255, .35); border-radius: 8px; pointer-events: none; }
  .pitch::after { content: ""; position: absolute; top: 8px; left: 50%; width: 46%; height: 64px; transform: translateX(-50%); border: 2px solid rgba(255, 255, 255, .35); border-top: 0; pointer-events: none; }
  .pitch-row { position: relative; z-index: 1; display: flex; justify-content: center; gap: 4px; margin: 6px 0; }
  .pcard {
    position: relative; flex: 0 1 92px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 2px; border: 2px solid transparent; border-radius: 12px; background: transparent; color: #fff; cursor: grab;
    transition: background .12s, border-color .12s;
  }
  .pcard:hover { background: rgba(255, 255, 255, .12); }
  .pcard:active { cursor: grabbing; }
  .pcard.sel { border-color: #fff; background: rgba(255, 255, 255, .18); }
  .pcard.drop { border-color: var(--green); background: rgba(0, 232, 143, .25); }
  .swapping .pcard:not(.sel), .bench.swapping .pcard:not(.sel) { border-style: dashed; border-color: rgba(255, 255, 255, .55); }
  .pcard.empty { cursor: pointer; }
  .pc-shirt { position: relative; }
  .pcard .kit { width: 46px; height: 46px; }
  .pc-band, .pc-flag {
    position: absolute; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%;
    font: 800 10px/1 var(--font); box-shadow: 0 1px 3px rgba(0, 0, 0, .4);
  }
  .pc-band { top: -4px; right: -8px; background: #fff; color: #1a0530; }

<script>
'use strict';

/* ---------- small helpers ---------- */

const $ = (sel, el = document) => el.querySelector(sel);

// Build a DOM node. String children become text nodes, so API data is never parsed as HTML.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k in el) el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(2)) if (kid != null && kid !== false) el.append(kid);
  return el;
}

async function api(path, options) {
  let res;
  try { res = await fetch(path, options); }
  catch { throw new Error("Can't reach the server. Is it still running?"); }
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const detail = data && data.detail;
    const err = new Error(typeof detail === 'string' ? detail : `Request failed (${res.status}).`);
    err.status = res.status;
    throw err;
  }
  return data;
}

const qs = (o) => new URLSearchParams(
  Object.entries(o).filter(([, v]) => v != null && v !== '')).toString();

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
};

const money = (v) => '£' + Number(v).toFixed(1) + 'm';
const one = (v) => Number(v).toFixed(1);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- state ---------- */

const state = {
  tab: 'captain',
  teamId: parseInt(store.get('fpl.teamId'), 10) || null,
  password: store.get('fpl.chatPassword'),  // only used when the server sets APP_PASSWORD
  meta: null,
  p: {
    captain: { scope: 'mine', top: 10 },
    transfers: { position: 'MID', max: 8, gws: 5, hideOwned: true },
    fixtures: { gws: 5 },
    differentials: { own: 5, position: '', max: '' },
    injuries: { team: '' },
    league: { id: store.get('fpl.leagueId'), view: store.get('fpl.leagueView') || 'radar', rival: null },
  },
};
const nextGw = () => state.meta ? state.meta.gameweek.next_gameweek : null;

const POSITIONS = [['GKP', 'Goalkeepers'], ['DEF', 'Defenders'], ['MID', 'Midfielders'], ['FWD', 'Forwards']];
const GW_WINDOWS = [[3, 'Next 3 gameweeks'], [5, 'Next 5 gameweeks'], [8, 'Next 8 gameweeks']];

/* ---------- control builders ---------- */

const field = (label, control) => h('label', { class: 'control' }, h('span', null, label), control);

function select(label, options, value, onChange) {
  return field(label, h('select', { class: 'field', onchange: (e) => onChange(e.target.value) },
    options.map(([v, text]) => h('option', { value: String(v), selected: String(v) === String(value) }, text))));
}

function numberInput(label, value, attrs, onChange) {
  return field(label, h('input', {
    class: 'field', type: 'number', ...attrs, value: String(value),
    oninput: debounce((e) => {
      const v = e.target.value === '' ? '' : parseFloat(e.target.value);
      if (v === '' || Number.isFinite(v)) onChange(v);
    }, 350),
  }));
}

function checkbox(label, checked, onChange) {
  return h('label', { class: 'check' },
    h('input', { type: 'checkbox', checked, onchange: (e) => onChange(e.target.checked) }), label);
}

function segmented(label, options, value, onChange) {
  const group = h('div', { class: 'seg', role: 'group', 'aria-label': label });
  for (const [v, text, disabledWhy] of options) {
    group.append(h('button', {
      class: 'seg-btn', type: 'button', 'aria-pressed': String(v === value),
      disabled: !!disabledWhy, title: disabledWhy || '',
      onclick: (e) => {
        for (const b of group.children) b.setAttribute('aria-pressed', String(b === e.currentTarget));
        onChange(v);
      },
    }, text));
  }
  return h('div', { class: 'control' }, h('span', null, label), group);
}

/* ---------- result builders ---------- */

const col = (label, cls, title) => ({ label, cls, title });

function table(columns, rows) {
  return h('div', { class: 'card' }, h('div', { class: 'table-wrap' }, h('table', null,
    h('thead', null, h('tr', null,
      columns.map((c) => h('th', { class: c.cls, title: c.title, scope: 'col' }, c.label)))),
    h('tbody', null, rows))));
}

const notice = (text, cls) => h('div', { class: 'notice' + (cls ? ' ' + cls : '') }, text);
const note = (text) => h('p', { class: 'note' }, text);

// Small line icons for the tabs. Static markup, so innerHTML is safe here.
const ICONS = {
  captain: '<circle cx="12" cy="12" r="9"/><path d="M15 9.5a4 4 0 1 0 0 5"/>',
  transfers: '<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
  fixtures: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  differentials: '<path d="M12 3l8 9-8 9-8-9z"/>',
  injuries: '<path d="M9 4h6v5h5v6h-5v5H9v-5H4V9h5z"/>',
  team: '<path d="M8 4l4 2 4-2 5 4-3 3-2-1v10H8V10l-2 1-3-3z"/>',
  planner: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M3 9h3v6H3M21 9h-3v6h3"/><circle cx="12" cy="12" r="2.2"/>',
  league: '<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4.5a3.5 3.5 0 0 0 3.6 3.6M16 6h3.5a3.5 3.5 0 0 1-3.6 3.6M12 13v4M8.5 20h7"/>',
};
function icon(name) {
  const el = h('span', { class: 'ico', 'aria-hidden': 'true' });
  el.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[name] || ''}</svg>`;
  return el;
}

// Home kits for the little shirts: [code, pattern, main, second, text on shirt].
//   solid   – shirt in main, collar and cuffs in second
//   sleeves – body in main, sleeves and collar in second (Arsenal, Villa…)
//   stripes – vertical main/second stripes, sleeves in main
//   hoops   – horizontal main/second bands, sleeves in main
const CLUBS = {
  'Arsenal': ['ARS', 'sleeves', '#db0007', '#ffffff', '#ffffff'],
  'Aston Villa': ['AVL', 'sleeves', '#670e36', '#95bfe5', '#ffffff'],
  'Bournemouth': ['BOU', 'stripes', '#da291c', '#111111', '#ffffff'],
  'Brentford': ['BRE', 'stripes', '#e30613', '#ffffff', '#111111'],
  'Brighton': ['BHA', 'stripes', '#0057b8', '#ffffff', '#0b2a5b'],
  'Burnley': ['BUR', 'sleeves', '#6c1d45', '#99d6ea', '#ffffff'],
  'Chelsea': ['CHE', 'solid', '#034694', '#ffffff', '#ffffff'],
  'Coventry City': ['COV', 'solid', '#78bee9', '#ffffff', '#0b2a5b'],
  'Crystal Palace': ['CRY', 'stripes', '#c4122e', '#1b458f', '#ffffff'],
  'Everton': ['EVE', 'solid', '#003399', '#ffffff', '#ffffff'],
  'Fulham': ['FUL', 'solid', '#ffffff', '#111111', '#111111'],
  'Hull City': ['HUL', 'solid', '#f5a12d', '#111111', '#111111'],
  'Ipswich Town': ['IPS', 'solid', '#3a64a3', '#ffffff', '#ffffff'],
  'Leeds': ['LEE', 'solid', '#ffffff', '#1d428a', '#1d428a'],
  'Leicester': ['LEI', 'solid', '#003090', '#fdbe11', '#ffffff'],
  'Liverpool': ['LIV', 'solid', '#c8102e', '#c8102e', '#ffffff'],
  'Luton': ['LUT', 'solid', '#f78f1e', '#002d62', '#002d62'],
  'Man City': ['MCI', 'solid', '#6cabdd', '#ffffff', '#1c2c5b'],
  'Man Utd': ['MUN', 'solid', '#da291c', '#ffffff', '#ffffff'],
  'Middlesbrough': ['MID', 'solid', '#e11b22', '#ffffff', '#ffffff'],
  'Newcastle': ['NEW', 'stripes', '#111111', '#ffffff', '#ffffff'],
  'Norwich': ['NOR', 'solid', '#fff200', '#00a650', '#00602f'],
  "Nott'm Forest": ['NFO', 'solid', '#dd0000', '#ffffff', '#ffffff'],
  'QPR': ['QPR', 'hoops', '#1d5ba4', '#ffffff', '#0b2a5b'],
  'Sheffield Utd': ['SHU', 'stripes', '#ee2737', '#ffffff', '#111111'],
  'Southampton': ['SOU', 'stripes', '#d71920', '#ffffff', '#111111'],
  'Spurs': ['TOT', 'solid', '#ffffff', '#132257', '#132257'],
  'Stoke': ['STK', 'stripes', '#e03a3e', '#ffffff', '#111111'],
  'Sunderland': ['SUN', 'stripes', '#eb172b', '#ffffff', '#111111'],
  'Watford': ['WAT', 'solid', '#fbee23', '#111111', '#111111'],
  'West Brom': ['WBA', 'stripes', '#122f67', '#ffffff', '#ffffff'],
  'West Ham': ['WHU', 'sleeves', '#7a263a', '#1bb1e7', '#ffffff'],
  'Wolves': ['WOL', 'solid', '#fdb913', '#231f20', '#231f20'],
};

// Shirt drawn in a 100×100 box: torso with a V neck, two short sleeves, and cuff bands.
const SHIRT = {
  torso: 'M22 4H38L50 15L62 4H78V96H22Z',
  sleeves: 'M22 4L0 24L13 42L22 34ZM78 4L100 24L87 42L78 34Z',
  cuffs: 'M0 24L13 42L15.7 39.6L3.3 21ZM100 24L87 42L84.3 39.6L96.7 21Z',
  collar: 'M38 4L50 15L62 4',
};
const isLight = (hex) => {
  const n = parseInt(hex.slice(1), 16);
  return 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255) > 150;
};
let kitSeq = 0;
function kit(team, size) {
  const [code, pattern, main, second, ink] = CLUBS[team]
    || [String(team || '').slice(0, 3).toUpperCase(), 'solid', '#6b5a80', '#a99bbd', '#ffffff'];
  const clip = 'kitclip' + (++kitSeq);
  let body = `<rect x="0" y="0" width="100" height="100" fill="${main}"/>`;
  if (pattern === 'stripes') {   // centre stripe in main, symmetrical edges
    for (let x = 14, i = 0; x < 86; x += 8, i++) if (i % 2) body += `<rect x="${x}" y="0" width="8" height="100" fill="${second}"/>`;
  } else if (pattern === 'hoops') {
    for (let y = 16, i = 1; y < 100; y += 12, i++) if (i % 2) body += `<rect x="0" y="${y}" width="100" height="12" fill="${second}"/>`;
  }
  const sleeve = pattern === 'sleeves' ? second : main;
  const cuffs = pattern === 'solid' && second !== main ? `<path d="${SHIRT.cuffs}" fill="${second}"/>` : '';
  // Busy patterns get a heavier outline behind the code so it stays readable on the stripes.
  const busy = pattern === 'stripes' || pattern === 'hoops';
  const outline = isLight(ink) ? `rgba(0,0,0,${busy ? 0.9 : 0.45})` : `rgba(255,255,255,${busy ? 0.95 : 0.7})`;
  const outlineW = busy ? 7 : 3;
  const label = code.replace(/[^A-Z0-9]/gi, '');
  const el = h('span', { class: 'kit' + (size ? ' ' + size : ''), title: team, role: 'img', 'aria-label': team });
  el.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true">
    <defs><clipPath id="${clip}"><path d="${SHIRT.torso}"/></clipPath></defs>
    <path d="${SHIRT.sleeves}" fill="${sleeve}"/>${cuffs}
    <g clip-path="url(#${clip})">${body}</g>
    <path d="M22 4V34M78 4V34" stroke="rgba(0,0,0,.18)" stroke-width="1.2" fill="none"/>
    <path d="${SHIRT.collar}" stroke="${second === main ? 'rgba(0,0,0,.25)' : second}" stroke-width="4" fill="none" stroke-linejoin="round"/>
    <text x="50" y="84" text-anchor="middle" fill="${ink}" stroke="${outline}" stroke-width="${outlineW}">${label}</text>
  </svg>`;
  return el;
}

const stat = (label, value, main) => h('div', { class: 'stat' + (main ? ' main' : '') },
  h('div', { class: 'k' }, label), h('div', { class: 'v' }, value));

// The top three as cards. `stats` is a list of [label, value function]; the first is highlighted.
function podium(players, stats) {
  if (!players || players.length < 3) return null;
  const fxKey = Object.keys(players[0]).find((k) => /^next_\d+_fixtures$/.test(k));
  return h('div', { class: 'podium' }, players.slice(0, 3).map((p, i) => h('div', { class: 'pod p' + (i + 1) },
    h('div', { class: 'pod-rank', 'aria-label': 'Rank ' + (i + 1) }, String(i + 1)),
    h('div', { class: 'pod-who' }, kit(p.team, 'lg'), h('div', null,
      h('div', { class: 'pod-name' }, p.name),
      h('div', { class: 'pod-meta' }, `${p.team} · ${p.position}`))),
    h('div', { class: 'pod-stats' }, stats.map(([label, value], n) => stat(label, value(p), n === 0))),
    fixtureChips(p[fxKey]))));
}

function chip(f) {
  return h('span', {
    class: 'fx fdr' + f.fdr,
    title: `GW${f.gw}: ${f.opponent} (${f.home ? 'home' : 'away'}), difficulty ${f.fdr} of 5`,
  }, `${f.opponent} (${f.home ? 'H' : 'A'})`, h('small', null, String(f.fdr)));
}

// The API describes a player's run as "GW11 ARS(H) FDR2, GW12 CHE(A) FDR4".
function fixtureChips(text) {
  const chips = [];
  for (const m of (text || '').matchAll(/GW(\d+) (\S+?)\((H|A)\) FDR(\d)/g)) {
    chips.push(chip({ gw: +m[1], opponent: m[2], home: m[3] === 'H', fdr: +m[4] }));
  }
  if (!chips.length) return h('span', { class: 'blank' }, 'No fixture');
  // Keep up to three chips per line so a narrow table scrolls sideways instead of stacking them.
  return h('div', { class: 'fxs', style: `min-width: ${Math.min(chips.length, 3) * 74}px` }, chips);
}

function legend() {
  return h('div', { class: 'legend' }, h('span', null, 'Fixture difficulty:'),
    [1, 2, 3, 4, 5].map((n) => h('span', { class: 'fx fdr' + n }, String(n))),
    h('span', null, '1 is easiest, 5 is hardest. (H) home, (A) away.'));
}

function statusFlag(p) {
  if (!p.status || p.status === 'available') return null;
  const chance = p.chance_of_playing_next_gw;
  return h('div', { class: 'status' + (p.status === 'doubtful' ? '' : ' out'), title: p.news || '' },
    cap(p.status) + (chance != null ? ` · ${chance}% to play` : ''));
}

function playerCell(p, badge, rank) {
  return h('td', null, h('div', { class: 'player' },
    rank ? h('span', { class: 'rank r' + Math.min(rank, 4) }, String(rank)) : null,
    kit(p.team),
    h('div', null,
      h('div', { class: 'name' }, p.name, badge ? h('span', { class: 'badge' }, badge) : null),
      h('div', { class: 'sub' }, p.team, ' · ', h('span', { class: 'pos ' + p.position }, p.position)),
      statusFlag(p))));
}

function scoreCell(value, max) {
  return h('td', { class: 'num strong' }, h('span', { class: 'score' }, one(value),
    h('div', { class: 'meter' }, h('i', { style: `width:${Math.max(4, Math.round(100 * value / (max || 1)))}%` }))));
}

function playerRow(p, fxKey, opt, rank) {
  return h('tr', null,
    playerCell(p, opt.badge && opt.badge(p), opt.score ? rank : null),
    h('td', { class: 'num' }, money(p.price_m)),
    h('td', { class: 'num' }, one(p.form)),
    h('td', { class: 'num' }, one(p.points_per_game)),
    h('td', { class: 'num' }, String(p.total_points)),
    h('td', { class: 'num' }, one(p.selected_by_pct) + '%'),
    h('td', null, fixtureChips(p[fxKey])),
    opt.score ? scoreCell(p[opt.score], opt.max) : null,
    h('td', { class: 'act' }, askPlayerBtn(p)));
}

function askPlayerBtn(p) {
  return h('button', {
    class: 'btn small', type: 'button', title: `Ask the assistant about ${p.name}`,
    onclick: () => askBot(`Tell me about ${p.full_name} (${p.team}): form, upcoming fixtures, and whether he's worth owning right now.`),
  }, 'Ask');
}

function playerColumns(opt) {
  return [
    col('Player'), col('Price', 'num'),
    col('Form', 'num', 'Average points per match over the last 30 days'),
    col('PPG', 'num', 'Points per game this season'),
    col('Pts', 'num', 'Total points this season'),
    col('Owned', 'num', 'Share of managers who own this player'),
    col('Next fixtures'),
    opt.score ? col('Score', 'num', 'Higher is better. See the note below the table.') : null,
    col('', 'act'),
  ].filter(Boolean);
}

function playerTable(players, opt = {}) {
  if (!players || !players.length) return notice('No players match these filters.');
  const fxKey = Object.keys(players[0]).find((k) => /^next_\d+_fixtures$/.test(k));
  if (opt.score) opt = { ...opt, max: Math.max(...players.map((p) => p[opt.score])) };
  return table(playerColumns(opt), players.map((p, i) => playerRow(p, fxKey, opt, i + 1)));
}

function fixtureGrid(d) {
  const columns = [col('Team'), ...d.gameweeks.map((g) => col('GW' + g)),
    col('Average', 'num', 'Average difficulty across these fixtures. Lower is easier.')];
  return table(columns, d.teams.map((t) => h('tr', null,
    h('th', { class: 'team', scope: 'row' }, h('div', { class: 'player' }, kit(t.team), t.team)),
    d.gameweeks.map((g) => {
      const fxs = t.fixtures.filter((f) => f.gw === g);
      return h('td', null, fxs.length ? h('div', { class: 'fxs' }, fxs.map(chip))
        : h('span', { class: 'blank', title: `No fixture in GW${g}` }, 'Blank'));
    }),
    h('td', { class: 'num strong' }, t.avg_fdr == null ? '–' : t.avg_fdr.toFixed(2)))));
}

function injuryTable(d) {
  if (!d.players.length) return notice('No flagged players.');
  const columns = [col('Player'), col('Status'), col('News'), col('Owned', 'num', 'Share of managers who own this player')];
  return table(columns, d.players.map((p) => h('tr', null,
    h('td', null, h('div', { class: 'player' }, kit(p.team),
      h('div', null, h('div', { class: 'name' }, p.name), h('div', { class: 'sub' }, p.team)))),
    h('td', null, statusFlag({ ...p, news: '' })),
    h('td', { class: 'wrap' }, p.news),
    h('td', { class: 'num' }, one(p.selected_by_pct) + '%'))));
}

function tiles(items) {
  return h('div', { class: 'tiles' }, items.filter(Boolean).map(([k, v, s]) => h('div', { class: 'tile' },
    h('div', { class: 'k' }, k), h('div', { class: 'v' }, v), s ? h('div', { class: 's' }, s) : null)));
}

function squadView(d) {
  const opt = { badge: (p) => (p.captain ? 'C' : p.vice_captain ? 'VC' : null) };
  const fxKey = Object.keys(d.squad[0] || {}).find((k) => /^next_\d+_fixtures$/.test(k));
  const columns = playerColumns(opt);
  const squad = [...d.squad].sort((a, b) => a.slot - b.slot);
  const group = (label) => h('tr', { class: 'group' }, h('th', { colSpan: columns.length, scope: 'colgroup' }, label));
  const rows = [
    group('Starting XI'), ...squad.filter((p) => p.starting).map((p) => playerRow(p, fxKey, opt)),
    group('Bench'), ...squad.filter((p) => !p.starting).map((p) => playerRow(p, fxKey, opt)),
  ];
  return [
    tiles([
      ['Team', d.team_name || '–', d.manager],
      ['Overall points', d.overall_points != null ? d.overall_points.toLocaleString() : '–'],
      ['Overall rank', d.overall_rank != null ? d.overall_rank.toLocaleString() : '–'],
      ['In the bank', money(d.bank_m)],
      ['Squad value', money(d.squad_value_m)],
      d.active_chip ? ['Chip played', cap(d.active_chip)] : null,
    ]),
    table(columns, rows),
    note(`Squad as of gameweek ${d.picks_from_gw}, the last deadline. Transfers made since then are not shown.`),
    legend(),
  ];
}

// "Compare" jumps to the head-to-head view against that manager.
function compareBtn(teamId, name) {
  if (!state.teamId || teamId === state.teamId) return null;
  return h('button', {
    class: 'btn small', type: 'button', title: `Compare your squad with ${name}`,
    onclick: () => { Object.assign(state.p.league, { view: 'h2h', rival: teamId }); store.set('fpl.leagueView', 'h2h'); showTab('league'); },
  }, 'Compare');
}

function leagueView(d) {
  const columns = [col('Rank', 'num'), col('Team'), col('Manager'),
    col('GW', 'num', 'Points this gameweek'), col('Total', 'num'), state.teamId ? col('', 'act') : null].filter(Boolean);
  return [
    table(columns, d.standings.map((r) => h('tr', { class: r.team_id === state.teamId ? 'me' : null },
      h('td', { class: 'num' }, String(r.rank)),
      h('td', { class: 'name' }, r.team, r.team_id === state.teamId ? h('span', { class: 'badge' }, 'You') : null),
      h('td', null, r.manager),
      h('td', { class: 'num' }, String(r.gw_points)),
      h('td', { class: 'num strong' }, r.total.toLocaleString()),
      state.teamId ? h('td', { class: 'act' }, compareBtn(r.team_id, r.team)) : null))),
    note(`${d.league}: top ${d.standings.length} shown.`),
  ];
}

/* ---------- rival radar ---------- */

// The radar costs ~100 FPL API calls on a cold server, so the page reuses it for 5 minutes.
let radarCache = null;
function getRadar(id) {
  const key = id + ':' + (state.teamId || '');
  if (!radarCache || radarCache.key !== key || Date.now() - radarCache.at > 5 * 60e3) {
    const entry = { key, at: Date.now(), promise: api(`/api/league/${id}/radar?` + qs({ team_id: state.teamId })) };
    entry.promise.catch(() => { if (radarCache === entry) radarCache = null; });
    radarCache = entry;
  }
  return radarCache.promise;
}

const CHIP_SHORT = { wildcard: 'WC', freehit: 'FH', bboost: 'BB', '3xc': 'TC', manager: 'AM' };
const pct = (v) => Math.round(v) + '%';

function chipPills(list, names) {
  if (list == null) return h('span', { class: 'blank' }, 'Unknown');
  if (!list.length) return h('span', { class: 'blank' }, 'None left');
  return h('div', { class: 'chips' }, list.map((c) => h('span', { class: 'chip-pill', title: names[c] || c }, CHIP_SHORT[c] || c)));
}

function roleTag(role) {
  const kind = /captain/.test(role) ? ' captain' : role === 'not owned' ? ' none' : '';
  return h('span', { class: 'role' + kind }, cap(role));
}

function section(title, blurb, ...body) {
  return h('section', { class: 'section' },
    h('div', { class: 'section-head' }, h('h3', null, title), blurb ? h('p', null, blurb) : null), body);
}

function eoTable(d, rows, showYou) {
  const max = Math.max(100, ...rows.map((o) => o.rival_eo));
  const columns = [col('Player'),
    col('Rival EO', 'num', 'Effective ownership among your rivals: the share who start him, with captains counted twice. Over 100% means he is captained a lot.'),
    col('Owned', 'num', 'Share of rivals with him in their 15'), col('Captained', 'num', 'Share of rivals captaining him'),
    showYou ? col('You') : null, col('Next fixtures'), col('', 'act')].filter(Boolean);
  return table(columns, rows.map((o) => {
    const p = d.players[o.id];
    return h('tr', null,
      playerCell(p),
      h('td', { class: 'num strong' }, h('span', { class: 'score' }, pct(o.rival_eo),
        h('div', { class: 'meter' }, h('i', { style: `width:${Math.max(4, Math.round(100 * o.rival_eo / max))}%` })))),
      h('td', { class: 'num' }, pct(o.owned_pct)),
      h('td', { class: 'num' }, pct(o.captained_pct)),
      showYou ? h('td', null, roleTag(o.my_role)) : null,
      h('td', null, fixtureChips(p.next_3_fixtures)),
      h('td', { class: 'act' }, askPlayerBtn(p)));
  }));
}

function captainSplit(d) {
  const caps = d.ownership.filter((o) => o.captained_pct > 0).sort((a, b) => b.captained_pct - a.captained_pct).slice(0, 6);
  const mine = d.me && d.me.picks.find((pk) => pk.c);
  const row = (p, value, label, badge) => h('div', { class: 'bar-row' }, kit(p.team),
    h('div', { class: 'bar-main' },
      h('div', { class: 'bar-label' }, h('span', { class: 'name' }, p.name), badge ? h('span', { class: 'badge' }, badge) : null,
        h('span', { class: 'bar-val' }, label)),
      h('div', { class: 'bar' }, h('i', { style: `width:${Math.max(value, 1)}%` }))));
  const lines = caps.map((o) => row(d.players[o.id], o.captained_pct, pct(o.captained_pct),
    mine && mine.id === o.id ? 'Your captain' : null));
  if (mine && !caps.some((o) => o.id === mine.id)) {
    lines.push(row(d.players[mine.id], 0, 'No rivals', 'Your captain'));
  }
  return h('div', { class: 'card split' }, lines);
}

function chipsTable(d) {
  const columns = [col('Rank', 'num'), col('Team'), col('GW', 'num', 'Points this gameweek'), col('Total', 'num'),
    col('Chips left', null, 'Chips still available before the next deadline'), col('Played', null, 'Chip played this gameweek'),
    state.teamId ? col('', 'act') : null].filter(Boolean);
  return table(columns, d.managers.map((m) => h('tr', { class: d.me && m.team_id === d.me.team_id ? 'me' : null },
    h('td', { class: 'num' }, String(m.rank)),
    h('td', null, h('div', { class: 'name' }, m.team, d.me && m.team_id === d.me.team_id ? h('span', { class: 'badge' }, 'You') : null),
      h('div', { class: 'sub' }, m.manager)),
    h('td', { class: 'num' }, String(m.gw_points)),
    h('td', { class: 'num strong' }, m.total.toLocaleString()),
    h('td', null, chipPills(m.chips_left, d.chip_names)),
    h('td', null, m.active_chip ? h('span', { class: 'chip-pill', title: d.chip_names[m.active_chip] || m.active_chip }, CHIP_SHORT[m.active_chip] || m.active_chip) : h('span', { class: 'blank' }, '–')),
    state.teamId ? h('td', { class: 'act' }, compareBtn(m.team_id, m.team)) : null)));
}

function radarNote(d) {
  return note([
    `Squads as of the GW${d.gameweek} deadline, compared across ${d.rivals_compared} rivals in ${d.league}.`,
    d.more_managers ? `Only the top ${d.managers.length} of the league are included.` : '',
    d.skipped ? `${d.skipped} squad${d.skipped > 1 ? 's' : ''} couldn't be read.` : '',
  ].filter(Boolean).join(' '));
}

function radarView(d) {
  const me = d.me;
  const leader = d.managers[0];
  const above = me ? d.managers.filter((m) => m.team_id !== me.team_id && (me.rank == null || m.rank < me.rank)).pop() : null;
  const topCap = [...d.ownership].sort((a, b) => b.captained_pct - a.captained_pct)[0];
  const tcLeft = d.managers.filter((m) => (!me || m.team_id !== me.team_id) && (m.chips_left || []).includes('3xc')).length;
  const out = [tiles([
    me ? ['Your league rank', me.rank ? '#' + me.rank : '–',
      me.rank === 1 ? 'Leading the league' : `${(leader.total - me.total).toLocaleString()} pts behind ${leader.team}`] : null,
    above ? ['Next target', above.team, `${(above.total - me.total).toLocaleString()} pts ahead of you`] : null,
    topCap && topCap.captained_pct ? ['Most captained', d.players[topCap.id].name, `${pct(topCap.captained_pct)} of rivals`] : null,
    ['Rivals holding a Triple Captain', String(tcLeft), `of ${d.rivals_compared}`],
  ])];
  if (me) {
    const threats = d.ownership.filter((o) => o.swing < -5).sort((a, b) => a.swing - b.swing).slice(0, 10);
    const edges = d.ownership.filter((o) => o.swing > 5).sort((a, b) => b.swing - a.swing).slice(0, 10);
    out.push(
      section('Threats', 'Players your rivals rely on more than you do. When they score, you drop places.',
        threats.length ? eoTable(d, threats, true) : notice('Nothing here: you cover everything your rivals own.')),
      section('Your edge', 'Players you rely on more than your rivals do. When they score, you climb.',
        edges.length ? eoTable(d, edges, true) : notice('Your squad matches the league template, so there is no edge yet.')));
  } else {
    out.push(
      notice('Enter your team ID in the top bar to see which players threaten you and which ones give you an edge.'),
      section('Most owned in this league', 'The league template: who your rivals start and captain.',
        eoTable(d, d.ownership.slice(0, 15), false)));
  }
  out.push(
    section('Captain split', `Who your rivals captained in GW${d.gameweek}.`, captainSplit(d)),
    section('Chips left', 'Chips each manager can still play before the next deadline.', chipsTable(d)),
    radarNote(d), legend());
  return out;
}

function h2hView(d) {
  const p = state.p.league;
  const me = d.me;
  if (!me) return notice('Enter your team ID in the top bar to compare yourself with a rival.');
  const others = d.managers.filter((m) => m.team_id !== me.team_id);
  // Default rival: the manager directly above you (or below, if you lead).
  let rival = others.find((m) => m.team_id === p.rival)
    || others.filter((m) => me.rank == null || m.rank < me.rank).pop() || others[0];
  p.rival = rival.team_id;
  p.rivalName = rival.team;

  const mine = new Map(me.picks.map((pk) => [pk.id, pk]));
  const theirs = new Map(rival.picks.map((pk) => [pk.id, pk]));
  const role = (pk) => !pk ? 'not owned' : pk.c ? (pk.mult === 3 ? 'triple captain' : 'captain')
    : !pk.xi ? (pk.mult ? 'bench (boosted)' : 'bench') : 'starting';
  const onlyThem = rival.picks.filter((pk) => !mine.has(pk.id));
  const onlyMe = me.picks.filter((pk) => !theirs.has(pk.id));
  const diffRole = me.picks.filter((pk) => theirs.has(pk.id) && theirs.get(pk.id).mult !== pk.mult);
  const same = me.picks.length - onlyMe.length - diffRole.length;
  const capName = (m) => { const c = m.picks.find((pk) => pk.c); return c ? d.players[c.id].name : '–'; };
  const gap = rival.total - me.total;

  const columns = [col('Player'), col('Them'), col('You'), col('Form', 'num', 'Average points per match over the last 30 days'),
    col('Next fixtures'), col('', 'act')];
  const group = (label, n) => h('tr', { class: 'group' }, h('th', { colSpan: columns.length, scope: 'colgroup' }, `${label} (${n})`));
  const row = (pk) => {
    const pl = d.players[pk.id];
    return h('tr', null, playerCell(pl), h('td', null, roleTag(role(theirs.get(pk.id)))), h('td', null, roleTag(role(mine.get(pk.id)))),
      h('td', { class: 'num' }, one(pl.form)), h('td', null, fixtureChips(pl.next_3_fixtures)), h('td', { class: 'act' }, askPlayerBtn(pl)));
  };
  const rows = [];
  if (onlyThem.length) rows.push(group('Only they have', onlyThem.length), ...onlyThem.map(row));
  if (onlyMe.length) rows.push(group('Only you have', onlyMe.length), ...onlyMe.map(row));
  if (diffRole.length) rows.push(group('Same player, different role', diffRole.length), ...diffRole.map(row));

  return [
    h('div', { class: 'controls' }, select('Rival', others.map((m) => [m.team_id, `#${m.rank} ${m.team} (${m.manager})`]),
      rival.team_id, (v) => { p.rival = +v; load(); })),
    tiles([
      ['Points gap', gap > 0 ? `${gap} behind` : gap < 0 ? `${-gap} ahead` : 'Level', `vs ${rival.team}`],
      ['Their captain', capName(rival), `Yours: ${capName(me)}`],
      ['Their chips left', chipPills(rival.chips_left, d.chip_names), h('span', null, 'Yours: ', chipPills(me.chips_left, d.chip_names))],
      ['Shared players', `${same} of ${me.picks.length}`, 'same player, same role'],
    ]),
    rows.length ? table(columns, rows) : notice('Your squads are identical, players and roles. Only a transfer or a captain change can split you.'),
    note(`Shared players in the same role score the same for both of you, so only the players above can change the gap. Squads as of the GW${d.gameweek} deadline.`),
    legend(),
  ];
}

/* ---------- squad planner ---------- */
// Everything happens in the page: nothing here changes the manager's real FPL team.
// Money is kept in tenths of a million (FPL's own unit) so sums don't drift.

const CHIPS = [['wildcard', 'Wildcard'], ['freehit', 'Free Hit'], ['bboost', 'Bench Boost'], ['3xc', 'Triple Captain']];
const chipName = (c) => (CHIPS.find(([k]) => k === c) || [c, c])[1];
const POS_NAME = { GKP: 'goalkeeper', DEF: 'defender', MID: 'midfielder', FWD: 'forward' };
const EMPTY_SQUAD = ['GKP', 'DEF', 'DEF', 'DEF', 'DEF', 'MID', 'MID', 'MID', 'MID', 'FWD', 'FWD', 'GKP', 'DEF', 'MID', 'FWD'];
const tenths = (v) => Math.round(v * 10);
const m10 = (t) => (t < 0 ? '−£' : '£') + (Math.abs(t) / 10).toFixed(1) + 'm';
const fold = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

let plannerPlayers = null;
function getPlannerPlayers() {
  if (!plannerPlayers || Date.now() - plannerPlayers.at > 10 * 60e3) {
    const entry = { at: Date.now(), promise: api('/api/planner/players').then((d) => ({ ...d, byId: new Map(d.players.map((p) => [p.id, p])) })) };
    entry.promise.catch(() => { if (plannerPlayers === entry) plannerPlayers = null; });
    plannerPlayers = entry;
  }
  return plannerPlayers.promise;
}

// pl.base is the squad as it stands in FPL; pl.plan is the manager's edited copy.
const pl = { data: null, base: null, plan: null, sel: null, swapping: false, drag: null, flash: '',
  sort: 'form', q: '', affordable: true, root: null, teamError: null };

const planKey = () => 'fpl.plan.' + (pl.base.teamId || 'new');
const savePlan = () => store.set(planKey(), JSON.stringify(pl.plan));
const teamOf = (p) => pl.data.teams[p.team];

function startPlanner({ players, team }) {
  pl.data = players;
  pl.teamError = team && team.error ? team.error : null;
  if (team && !team.error) {
    const cap = team.squad.find((s) => s.captain), vice = team.squad.find((s) => s.vice);
    pl.base = {
      teamId: state.teamId, fresh: false, team, bank: tenths(team.bank), ft: team.free_transfers,
      chipsLeft: team.chips_left, ids: new Set(team.squad.map((s) => s.id)),
      sell: new Map(team.squad.map((s) => [s.id, tenths(s.sell)])),
      slots: team.squad.map((s) => ({ pos: players.byId.get(s.id).pos, id: s.id })),
      captain: cap ? cap.id : null, vice: vice ? vice.id : null,
    };
  } else {
    pl.base = { teamId: null, fresh: true, team: null, bank: 1000, ft: 0, chipsLeft: null, ids: new Set(), sell: new Map(),
      slots: EMPTY_SQUAD.map((pos) => ({ pos, id: null })), captain: null, vice: null };
  }
  pl.plan = loadPlan() || freshPlan();
  Object.assign(pl, { sel: null, swapping: false, drag: null, flash: '', q: '' });
  pl.root = h('div', { class: 'planner-wrap' });
  drawPlanner();
  return pl.root;
}

function freshPlan() {
  const b = pl.base;
  return { gw: pl.data.gameweek, slots: b.slots.map((s) => ({ ...s })), captain: b.captain, vice: b.vice, chip: null, ft: b.ft };
}

// A saved plan only applies to the same gameweek; after the deadline the real squad has moved on.
function loadPlan() {
  try {
    const saved = JSON.parse(store.get(planKey()) || 'null');
    if (!saved || saved.gw !== pl.data.gameweek || !Array.isArray(saved.slots) || saved.slots.length !== 15) return null;
    if (!saved.slots.every((s) => s && POS_NAME[s.pos] && (s.id == null || pl.data.byId.has(s.id)))) return null;
    if (saved.chip && pl.base.chipsLeft && !pl.base.chipsLeft.includes(saved.chip)) saved.chip = null;
    return saved;
  } catch { return null; }
}

function planStats() {
  const { plan, base } = pl, P = pl.data.byId;
  const ids = plan.slots.map((s) => s.id).filter(Boolean);
  const have = new Set(ids);
  const outs = [...base.ids].filter((id) => !have.has(id));
  const ins = ids.filter((id) => !base.ids.has(id));
  const price = (id) => (base.sell.has(id) ? base.sell.get(id) : tenths(P.get(id).price));
  const bank = base.bank + outs.reduce((t, id) => t + base.sell.get(id), 0) - ins.reduce((t, id) => t + tenths(P.get(id).price), 0);
  const value = bank + ids.reduce((t, id) => t + price(id), 0);
  const free = base.fresh || plan.chip === 'wildcard' || plan.chip === 'freehit';
  const hits = free ? 0 : Math.max(0, ins.length - plan.ft) * 4;
  const clubs = {};
  for (const id of ids) { const t = P.get(id).team; clubs[t] = (clubs[t] || 0) + 1; }
  const empty = plan.slots.length - ids.length;
  const xi = new Set(plan.slots.slice(0, 11).map((s) => s.id));
  const warnings = [];
  if (empty) warnings.push(`${empty} empty slot${empty > 1 ? 's' : ''} to fill.`);
  if (bank < 0) warnings.push(`Over budget by ${m10(-bank)}.`);
  for (const [t, n] of Object.entries(clubs)) if (n > 3) warnings.push(`${n} ${pl.data.teams[t].name} players: the limit is 3 per club.`);
  if (!plan.captain || !xi.has(plan.captain)) warnings.push('Pick a captain from your starting XI.');
  else if (!plan.vice || !xi.has(plan.vice)) warnings.push('Pick a vice-captain from your starting XI.');
  // Pair each sale with a purchase in the same position, so the list reads "A out, B in".
  const left = [...ins];
  const pairs = outs.map((o) => {
    const k = left.findIndex((i) => P.get(i).pos === P.get(o).pos);
    return [o, k >= 0 ? left.splice(k, 1)[0] : null];
  });
  return { outs, ins, pairs, bank, value, hits, free, clubs, empty, warnings };
}

function formationProblem(slots) {
  const n = { GKP: 0, DEF: 0, MID: 0, FWD: 0 };
  slots.slice(0, 11).forEach((s) => n[s.pos]++);
  if (n.DEF < 3) return 'Your starting XI needs at least 3 defenders.';
  if (n.MID < 2) return 'Your starting XI needs at least 2 midfielders.';
  if (n.FWD < 1) return 'Your starting XI needs at least 1 forward.';
  return null;
}

function say(msg) { pl.flash = msg; drawPlanner(); }
function changed() { pl.flash = ''; savePlan(); drawPlanner(); }

function trySwap(a, b) {
  if (a === b) return;
  if (a > b) [a, b] = [b, a];
  const S = pl.plan.slots;
  pl.swapping = false;
  if (b < 11) return say('Both players are already in your starting XI.');
  if (a >= 11 && a === 11) return say('Your bench goalkeeper always sits first on the bench.');
  if (a < 11 && (S[a].pos === 'GKP') !== (S[b].pos === 'GKP')) return say('A goalkeeper can only swap with the other goalkeeper.');
  const next = S.slice();
  [next[a], next[b]] = [next[b], next[a]];
  if (a < 11) { const why = formationProblem(next); if (why) return say(why); }
  pl.plan.slots = next;
  if (a < 11) {  // the armband follows the player who comes into the XI
    const off = S[a].id, on = S[b].id;
    if (off && pl.plan.captain === off) pl.plan.captain = on;
    if (off && pl.plan.vice === off) pl.plan.vice = on;
  }
  pl.sel = null;
  changed();
}

function setArmband(kind, id) {
  const plan = pl.plan, other = kind === 'captain' ? 'vice' : 'captain';
  if (plan[other] === id) plan[other] = plan[kind];
  plan[kind] = id;
  changed();
}

function sellSlot(i) {
  const s = pl.plan.slots[i];
  if (pl.plan.captain === s.id) { pl.plan.captain = pl.plan.vice; pl.plan.vice = null; }  // vice steps up, as in FPL
  if (pl.plan.vice === s.id) pl.plan.vice = null;
  pl.plan.slots[i] = { pos: s.pos, id: null };
  pl.q = '';
  changed();  // the slot stays selected, so the picker opens for it
}

function buy(id) {
  const i = pl.sel;
  if (i == null || pl.plan.slots[i].id) return;
  pl.plan.slots[i] = { pos: pl.plan.slots[i].pos, id };
  pl.sel = null;
  changed();
}

// Undo a transfer: the sold player goes back where the new one is (or into an empty slot).
function undoTransfer(outId, inId) {
  const S = pl.plan.slots, pos = pl.data.byId.get(outId).pos;
  let i = inId ? S.findIndex((s) => s.id === inId) : -1;
  if (i < 0) i = S.findIndex((s) => !s.id && s.pos === pos);
  if (i < 0) return say('Free up a slot in that position first.');
  S[i] = { pos, id: outId };
  pl.sel = null;
  changed();
}

function cardClick(i) {
  if (pl.swapping && pl.sel != null && pl.sel !== i) return trySwap(pl.sel, i);
  pl.swapping = false;
  pl.flash = '';
  pl.sel = pl.sel === i ? null : i;
  pl.q = '';
  drawPlanner();
  // On a phone the side panel sits under the pitch, so bring it into view.
  if (pl.sel != null && pl.root.offsetWidth < 860) { const side = $('.pside', pl.root); if (side) side.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}

function emptyKit() {
  const el = h('span', { class: 'kit empty-kit', 'aria-hidden': 'true' });
  el.innerHTML = `<svg viewBox="0 0 100 100"><path d="${SHIRT.torso}M22 4L0 24L13 42L22 34M78 4L100 24L87 42L78 34" fill="rgba(255,255,255,.12)"
    stroke="rgba(255,255,255,.8)" stroke-width="3" stroke-dasharray="7 5" stroke-linejoin="round"/>
    <path d="M50 40v26M37 53h26" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>`;
  return el;
}

function planCard(i) {
  const s = pl.plan.slots[i], p = s.id ? pl.data.byId.get(s.id) : null;
  const card = h('button', {
    class: 'pcard' + (p ? '' : ' empty') + (pl.sel === i ? ' sel' : ''), type: 'button', draggable: !!p,
    title: p ? `${p.full_name}: tap for options, or drag onto another player to swap` : `Empty ${POS_NAME[s.pos]} slot: tap to pick a player`,
    onclick: () => cardClick(i),
    ondragstart: (e) => { pl.drag = i; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); },
    ondragend: () => { pl.drag = null; },
    ondragover: (e) => { if (pl.drag != null && pl.drag !== i) { e.preventDefault(); card.classList.add('drop'); } },
    ondragleave: () => card.classList.remove('drop'),
    ondrop: (e) => { e.preventDefault(); const from = pl.drag; pl.drag = null; if (from != null) trySwap(from, i); },
  });
  if (!p) {
    card.append(emptyKit(), h('span', { class: 'pc-name' }, 'Add ' + s.pos));
    return card;
  }
  const team = teamOf(p), plan = pl.plan;
  const band = plan.captain === p.id ? (plan.chip === '3xc' ? 'TC' : 'C') : plan.vice === p.id ? 'V' : null;
  const fxs = team.fixtures.filter((f) => f.gw === pl.data.gameweek);
  card.append(
    h('span', { class: 'pc-shirt' }, kit(team.name),
      band ? h('span', { class: 'pc-band' + (band === 'TC' ? ' tc' : ''), title: band === 'V' ? 'Vice-captain' : 'Captain' }, band) : null,
      p.status !== 'available' ? h('span', { class: 'pc-flag' + (p.status === 'doubtful' ? '' : ' out'), title: p.news || cap(p.status) }, '!') : null),
    h('span', { class: 'pc-name' }, p.name),
    h('span', { class: 'pc-price' }, money(p.price)),
    h('span', { class: 'pc-fx' }, fxs.length
      ? fxs.map((f) => h('span', { class: 'fdr' + f.fdr, title: `GW${f.gw}: ${f.opponent} (${f.home ? 'home' : 'away'}), difficulty ${f.fdr}` }, `${f.opponent} (${f.home ? 'H' : 'A'})`))
      : h('span', { class: 'pc-blank' }, 'Blank')));
  return card;
}

function plannerBar(s) {
  const { plan, base } = pl;
  return h('div', { class: 'controls planner-bar' },
    h('div', { class: 'control' }, h('span', null, 'Chip'), h('div', { class: 'seg', role: 'group', 'aria-label': 'Chip' },
      CHIPS.map(([c, name]) => {
        const ok = !base.chipsLeft || base.chipsLeft.includes(c);
        return h('button', {
          class: 'seg-btn', type: 'button', 'aria-pressed': String(plan.chip === c), disabled: !ok,
          title: ok ? (plan.chip === c ? 'Tap again to cancel' : '') : 'Already used in this half of the season',
          onclick: () => { plan.chip = plan.chip === c ? null : c; changed(); },
        }, name);
      }))),
    base.fresh ? null : select('Free transfers', [0, 1, 2, 3, 4, 5].map((n) => [n, String(n)]), plan.ft,
      (v) => { plan.ft = +v; changed(); }),
    h('div', { class: 'control' }, h('span', null, ' '),
      h('button', { class: 'btn', type: 'button', onclick: () => { pl.plan = freshPlan(); pl.sel = null; changed(); } },
        base.fresh ? 'Clear squad' : 'Reset to my team')));
}

function summaryPanel(s) {
  const P = pl.data.byId, { base, plan } = pl;
  const notes = {
    wildcard: 'Wildcard: unlimited free transfers, and they stay after the gameweek.',
    freehit: 'Free Hit: unlimited free transfers for one gameweek, then your squad goes back to how it was.',
    bboost: 'Bench Boost: your bench players score too.',
    '3xc': 'Triple Captain: your captain scores three times their points.',
  };
  return [
    h('h3', null, 'Your plan'),
    s.warnings.length ? h('ul', { class: 'warn' }, s.warnings.map((w) => h('li', null, w))) : h('p', { class: 'ok' }, 'Squad is valid and ready.'),
    base.fresh ? null : s.pairs.length
      ? h('div', { class: 'tlist' }, s.pairs.map(([o, n]) => h('div', { class: 'trow' },
          h('span', { class: 't-out', title: P.get(o).full_name }, P.get(o).name, ' ', h('small', null, m10(base.sell.get(o)))),
          h('span', { 'aria-hidden': 'true' }, '→'),
          n ? h('span', { class: 't-in', title: P.get(n).full_name }, P.get(n).name, ' ', h('small', null, money(P.get(n).price))) : h('span', { class: 'blank' }, 'Empty slot'),
          h('button', { class: 'btn small', type: 'button', onclick: () => undoTransfer(o, n) }, 'Undo'))))
      : h('p', { class: 'sub' }, 'No transfers yet. Tap a player and choose Transfer out.'),
    plan.chip ? h('p', { class: 'sub' }, notes[plan.chip]) : null,
    h('p', { class: 'sub' }, 'Drag a player onto another to swap starter and bench, or tap a player to captain, substitute or sell them. Your plan is saved in this browser until the deadline.'),
  ];
}

function playerPanel(i) {
  const p = pl.data.byId.get(pl.plan.slots[i].id), team = teamOf(p), { plan, base } = pl;
  const starting = i < 11;
  return [
    h('div', { class: 'pp-head' }, kit(team.name, 'lg'), h('div', null,
      h('div', { class: 'pod-name' }, p.name),
      h('div', { class: 'sub' }, team.name, ' · ', h('span', { class: 'pos ' + p.pos }, p.pos), starting ? ' · Starting' : ' · Bench'))),
    statusFlag({ status: p.status, chance_of_playing_next_gw: p.chance, news: p.news }),
    p.news ? h('p', { class: 'sub' }, p.news) : null,
    h('div', { class: 'pod-stats' },
      stat('Price', money(p.price), true),
      base.sell.has(p.id) ? stat('Sells for', m10(base.sell.get(p.id))) : null,
      stat('Form', one(p.form)), stat('Points', String(p.total)), stat('Owned', one(p.owned) + '%')),
    h('div', { class: 'fxs' }, team.fixtures.length ? team.fixtures.map(chip) : h('span', { class: 'blank' }, 'No fixtures')),
    pl.swapping ? h('p', { class: 'flash', style: 'margin:12px 0 0' }, `Now tap the player to swap with ${p.name}.`) : null,
    h('div', { class: 'pp-actions' },
      starting ? h('button', { class: 'btn small', type: 'button', disabled: plan.captain === p.id, onclick: () => setArmband('captain', p.id) }, 'Make captain') : null,
      starting ? h('button', { class: 'btn small', type: 'button', disabled: plan.vice === p.id, onclick: () => setArmband('vice', p.id) }, 'Make vice') : null,
      h('button', {
        class: 'btn small', type: 'button', 'aria-pressed': String(pl.swapping),
        onclick: () => { pl.swapping = !pl.swapping; drawPlanner(); if (pl.swapping && pl.root.offsetWidth < 860) $('.pitch', pl.root).scrollIntoView({ behavior: 'smooth', block: 'start' }); },
      }, pl.swapping ? 'Cancel swap' : starting ? 'Substitute' : 'Bring on'),
      h('button', { class: 'btn small', type: 'button', onclick: () => sellSlot(i) }, base.ids.has(p.id) ? 'Transfer out' : 'Remove'),
      askPlayerBtn({ ...p, team: team.name }),
      h('button', { class: 'btn small', type: 'button', onclick: () => { pl.sel = null; pl.swapping = false; drawPlanner(); } }, 'Close')),
  ];
}

function pickerPanel(i, s) {
  const pos = pl.plan.slots[i].pos, P = pl.data, { base } = pl;
  const taken = new Set(pl.plan.slots.map((x) => x.id).filter(Boolean));
  const budget = s.bank;  // the slot is already empty, so the bank includes the sale
  const putBack = s.outs.filter((o) => P.byId.get(o).pos === pos);
  const list = h('div', { class: 'picks', role: 'list' });

  function drawList() {
    const q = fold(pl.q.trim());
    const sorters = { form: (a, b) => b.form - a.form, total: (a, b) => b.total - a.total, price: (a, b) => b.price - a.price,
      cheap: (a, b) => a.price - b.price, owned: (a, b) => b.owned - a.owned };
    const rows = P.players.filter((p) => p.pos === pos && !taken.has(p.id) && p.status !== 'unavailable'
        && (!pl.affordable || tenths(p.price) <= budget)
        && (!q || fold(p.name).includes(q) || fold(p.full_name).includes(q) || fold(teamOf(p).name).includes(q)))
      .sort(sorters[pl.sort]).slice(0, 60);
    list.replaceChildren(...(rows.length ? rows.map((p) => {
      const team = teamOf(p), full = (s.clubs[p.team] || 0) >= 3;
      return h('div', { class: 'pick-row', role: 'listitem' }, kit(team.name),
        h('div', { class: 'pr-main' },
          h('div', { class: 'name', title: p.full_name }, p.name),
          h('div', { class: 'sub' }, `${team.short} · ${money(p.price)} · form ${one(p.form)} · ${p.total} pts`),
          statusFlag({ status: p.status, chance_of_playing_next_gw: p.chance, news: p.news }),
          h('div', { class: 'fxs' }, team.fixtures.map(chip))),
        h('button', {
          class: 'btn small primary', type: 'button', disabled: full,
          title: full ? `You already have 3 ${team.name} players` : `Add ${p.name} for ${money(p.price)}`,
          onclick: () => buy(p.id),
        }, 'Add'));
    }) : [h('p', { class: 'sub', style: 'padding:12px 16px' }, pl.affordable ? 'Nobody matches within your budget. Untick "Only what I can afford" or sell someone else first.' : 'Nobody matches.')]));
  }
  drawList();

  return [
    h('h3', null, 'Pick a ' + POS_NAME[pos]),
    h('p', { class: 'sub' }, budget >= 0 ? `You can spend up to ${m10(budget)}.` : `You're already ${m10(-budget)} over budget.`),
    putBack.length ? h('div', { class: 'putback' }, putBack.map((o) => h('button', {
      class: 'btn small', type: 'button', onclick: () => undoTransfer(o, null),
    }, `Keep ${P.byId.get(o).name}`))) : null,
    h('div', { class: 'pick-tools' },
      field('Search', h('input', {
        class: 'field', type: 'search', value: pl.q, placeholder: 'Name or club',
        oninput: (e) => { pl.q = e.target.value; drawList(); },
      })),
      select('Sort by', [['form', 'Form'], ['total', 'Total points'], ['owned', 'Most owned'], ['price', 'Price, high to low'], ['cheap', 'Price, low to high']],
        pl.sort, (v) => { pl.sort = v; drawList(); }),
      checkbox('Only what I can afford', pl.affordable, (v) => { pl.affordable = v; drawList(); }),
      h('button', { class: 'btn small', type: 'button', onclick: () => { pl.sel = null; drawPlanner(); } }, 'Cancel')),
    list,
  ];
}

function drawPlanner() {
  const s = planStats(), { plan, base } = pl;
  const xiRows = ['GKP', 'DEF', 'MID', 'FWD'].map((pos) => h('div', { class: 'pitch-row' },
    plan.slots.slice(0, 11).map((slot, i) => [slot, i]).filter(([slot]) => slot.pos === pos).map(([, i]) => planCard(i))));
  const sel = pl.sel != null ? plan.slots[pl.sel] : null;
  pl.root.replaceChildren(...[
    pl.teamError ? notice(`Couldn't load your squad: ${pl.teamError} This starts from an empty £100m squad instead.`) : null,
    tiles([
      ['In the bank', m10(s.bank), s.bank < 0 ? 'Over budget' : `Squad value ${m10(s.value)}`],
      base.fresh ? ['Players picked', `${15 - s.empty} of 15`, '£100m budget']
        : ['Transfers', String(s.ins.length), s.free ? `Free with ${plan.chip ? chipName(plan.chip) : 'the builder'}` : `${plan.ft} free`],
      base.fresh ? null : ['Points hit', s.hits ? `−${s.hits}` : '0', s.hits ? `${s.ins.length - plan.ft} extra × 4 pts` : 'No hit taken'],
      ['Chip', plan.chip ? chipName(plan.chip) : 'None', base.team ? `Planning GW${pl.data.gameweek} from your GW${base.team.squad_from_gw} squad` : `Planning GW${pl.data.gameweek}`],
    ]),
    plannerBar(s),
    pl.flash ? h('div', { class: 'flash', role: 'status' }, pl.flash) : null,
    h('div', { class: 'planner' },
      h('div', null,
        h('div', { class: 'pitch' + (pl.swapping ? ' swapping' : '') }, xiRows),
        h('div', { class: 'bench' + (pl.swapping ? ' swapping' : '') },
          h('div', { class: 'bench-label' }, plan.chip === 'bboost' ? 'Bench · boosted, all four score' : 'Bench'),
          h('div', { class: 'pitch-row' }, [11, 12, 13, 14].map(planCard)))),
      h('div', { class: 'card pside', 'aria-live': 'polite' },
        !sel ? summaryPanel(s) : sel.id ? playerPanel(pl.sel) : pickerPanel(pl.sel, s))),
    note(base.fresh ? 'Builder mode: prices are current prices.'
      : 'Selling prices follow the FPL rule (you keep half of any rise) and are worked out from your transfer history. Free transfers are an estimate, so check the number in the FPL app. Nothing here changes your real team.'),
    legend(),
  ].filter(Boolean));
}

function planText() {
  const s = planStats(), P = pl.data.byId, { plan, base } = pl;
  const nm = (id) => P.get(id).name + (plan.captain === id ? (plan.chip === '3xc' ? ' (TC)' : ' (C)') : plan.vice === id ? ' (VC)' : '');
  const names = (from, to) => plan.slots.slice(from, to).filter((x) => x.id).map((x) => nm(x.id)).join(', ') || 'none';
  const lines = [
    `Here is my plan for GW${pl.data.gameweek}${plan.chip ? `, playing my ${chipName(plan.chip)}` : ''}.`,
    `Starting XI: ${names(0, 11)}.`,
    `Bench: ${names(11, 15)}.`,
  ];
  if (!base.fresh) {
    lines.push(s.pairs.length ? `Transfers: ${s.pairs.map(([o, n]) => `${P.get(o).name} out, ${n ? P.get(n).name + ' in' : 'slot left empty'}`).join('; ')}.` : 'No transfers.');
  }
  lines.push(`Money left: ${m10(s.bank)}.` + (s.hits ? ` Points hit: −${s.hits}.` : ''));
  if (s.warnings.length) lines.push('Problems: ' + s.warnings.join(' '));
  lines.push('Is this a good plan? What would you change?');
  return lines.join('\n');
}

/* ---------- explore views ---------- */
// Each view returns: title, blurb, controls, fetch (or `need` when input is missing), render, ask.
